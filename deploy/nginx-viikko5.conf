# /etc/nginx/snippets/viikko5.conf – installed by deploy/deploy.sh
# Included from the EXISTING server block with one line:
#     include snippets/viikko5.conf;
# Other locations (/, /viikko2/, /viikko3/) are not changed.

location = /viikko5 {
    return 301 /viikko5/;
}

location /viikko5/ {
    # Trailing slash: /viikko5/api/chat -> http://127.0.0.1:8005/api/chat
    proxy_pass http://127.0.0.1:8005/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /viikko5;
    # A small model on a CPU can take a while to answer.
    proxy_read_timeout 180s;
    client_max_body_size 64k;
}
